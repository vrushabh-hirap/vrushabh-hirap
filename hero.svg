<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066cc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2997ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- fine grid, barely visible, gives it depth without a gradient blob -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="195" x2="900" y2="195"/>
    <line x1="225" y1="0" x2="225" y2="260"/>
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="675" y1="0" x2="675" y2="260"/>
  </g>

  <!-- kicker -->
  <text x="60" y="72" font-family="SF Pro Text, -apple-system, system-ui, sans-serif"
        font-size="13" letter-spacing="3" fill="#2997ff" font-weight="600">
    SOFTWARE ENGINEER — IN PROGRESS
  </text>

  <!-- name -->
  <text x="58" y="150" font-family="SF Pro Display, -apple-system, system-ui, sans-serif"
        font-size="64" letter-spacing="-2" fill="#f5f5f7" font-weight="600">
    Vrushabh Hirap
  </text>

  <!-- accent underline -->
  <rect x="60" y="172" width="120" height="3" fill="url(#accentLine)"/>

  <!-- tagline -->
  <text x="60" y="212" font-family="SF Pro Text, -apple-system, system-ui, sans-serif"
        font-size="18" letter-spacing="0" fill="#a1a1a6" font-weight="400">
    Android · Full-Stack · Backend Engineering · AI &amp; ML
  </text>

  <!-- corner mark, quiet signature detail -->
  <circle cx="850" cy="50" r="4" fill="#0066cc"/>
  <text x="862" y="54" font-family="SF Pro Text, -apple-system, system-ui, sans-serif"
        font-size="11" fill="#4d4d4f">2026</text>
</svg>
